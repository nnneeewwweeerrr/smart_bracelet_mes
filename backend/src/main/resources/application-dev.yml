server:
  port: 8080

spring:
  application:
    name: smart-bracelet-mes
  datasource:
    url: jdbc:h2:mem:smart_bracelet_mes;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.mes.entity

jwt:
  secret: smart-bracelet-mes-secret-key-2026
  expiration: 86400000

ai:
  api-key: 
  model-name: gpt-4o-mini
  api-url: 
  timeout: 30000
  max-tokens: 2000
  temperature: 0.7

neo4j:
  uri: bolt://localhost:7687
  username: neo4j
  password: neo4j
  enabled: false